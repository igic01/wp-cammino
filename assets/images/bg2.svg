<svg xmlns="http://www.w3.org/2000/svg" width="960" height="7200" viewBox="0 0 960 7200" preserveAspectRatio="none">
  <!-- Cammino long-form page background: designed to span an entire multi-section page -->
  <defs>
    <linearGradient id="page-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7F2"/>
      <stop offset=".3" stop-color="#F8FAF7"/>
      <stop offset=".62" stop-color="#F4F7F2"/>
      <stop offset="1" stop-color="#EDF3ED"/>
    </linearGradient>
  </defs>

  <!-- The artwork was composed as a long journey and fitted into a true 1:7.5 portrait canvas -->
  <g transform="scale(.5 1.2)">
  <rect width="1920" height="6000" fill="url(#page-cream)"/>

  <!-- Opening: soft sage orbit and apricot counterweight -->
  <path d="M1450-150c225 0 455 89 550 266 94 177 35 421-124 545-158 124-410 124-561-10-151-135-195-403-75-579 51-75 124-157 210-222Z" fill="#D6E5D0" opacity=".5"/>
  <ellipse cx="1690" cy="175" rx="265" ry="242" fill="#F4F7F2" opacity=".5"/>
  <path d="M-190 535c115-105 298-133 423-55 126 78 181 272 111 405-71 134-264 208-407 145-142-62-226-253-169-395 10-25 24-59 42-100Z" fill="#B8D3A6" opacity=".2"/>
  <circle cx="48" cy="751" r="76" fill="#6D9357" opacity=".07"/>

  <!-- A continuous route follows the page without competing with central content -->
  <path
    d="M1780 370
       C1645 585 1817 760 1710 982
       C1610 1189 1762 1398 1660 1604
       C1553 1819 1768 2022 1675 2245
       C1588 2452 1777 2677 1680 2890
       C1572 3129 1760 3314 1660 3545
       C1559 3776 1749 3975 1648 4214
       C1551 4443 1734 4652 1634 4883
       C1532 5119 1711 5358 1582 5603
       C1530 5702 1485 5784 1448 5880"
    fill="none"
    stroke="#6D9357"
    stroke-width="8"
    stroke-linecap="round"
    opacity=".23"
  />
  <path d="m1432 5847 16 34 37-11" fill="none" stroke="#6D9357" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".23"/>

  <!-- First transition: plum route rings on the left -->
  <path d="M-270 1460C74 1475 281 1271 355 1015" fill="none" stroke="#2D5062" stroke-width="2" opacity=".1"/>
  <path d="M-235 1552C139 1560 395 1314 445 1017" fill="none" stroke="#2D5062" stroke-width="54" opacity=".04"/>
  <circle cx="268" cy="1260" r="14" fill="#B8D3A6" opacity=".55"/>
  <circle cx="310" cy="1287" r="9" fill="#D6E5D0" opacity=".75"/>

  <!-- Mid-page sage landscape entering from the left -->
  <path d="M-235 1935c173-151 425-197 612-92 188 105 278 366 185 561-92 194-360 321-570 248-211-74-360-327-303-543 18-67 45-124 96-174Z" fill="#D6E5D0" opacity=".34"/>
  <ellipse cx="60" cy="2214" rx="250" ry="220" fill="#F4F7F2" opacity=".54"/>
  <path d="M318 2500c81-45 139-2 198-54 52-45 57-126 138-148" fill="none" stroke="#2D5062" stroke-width="6" stroke-linecap="round" opacity=".12"/>

  <!-- Stepping rhythm through the journey -->
  <g fill="#2D5062" opacity=".1">
    <ellipse cx="142" cy="1115" rx="17" ry="24" transform="rotate(-26 142 1115)"/>
    <ellipse cx="177" cy="1067" rx="13" ry="19" transform="rotate(-17 177 1067)"/>
    <ellipse cx="1748" cy="1798" rx="15" ry="22" transform="rotate(22 1748 1798)"/>
    <ellipse cx="1780" cy="1848" rx="18" ry="25" transform="rotate(30 1780 1848)"/>
    <ellipse cx="132" cy="2902" rx="18" ry="25" transform="rotate(-29 132 2902)"/>
    <ellipse cx="169" cy="2851" rx="14" ry="20" transform="rotate(-19 169 2851)"/>
    <ellipse cx="1742" cy="3933" rx="15" ry="22" transform="rotate(20 1742 3933)"/>
    <ellipse cx="1775" cy="3981" rx="18" ry="25" transform="rotate(29 1775 3981)"/>
    <ellipse cx="164" cy="5008" rx="18" ry="25" transform="rotate(-27 164 5008)"/>
    <ellipse cx="201" cy="4957" rx="14" ry="20" transform="rotate(-18 201 4957)"/>
  </g>

  <!-- Central transition: restrained apricot arc at the far right -->
  <circle cx="1935" cy="3000" r="390" fill="#B8D3A6" opacity=".14"/>
  <circle cx="1935" cy="3000" r="270" fill="none" stroke="#6D9357" stroke-width="62" opacity=".07"/>
  <circle cx="1935" cy="3000" r="145" fill="#F4F7F2" opacity=".64"/>
  <circle cx="1548" cy="3190" r="18" fill="#6D9357" opacity=".38"/>
  <circle cx="1594" cy="3222" r="12" fill="#B8D3A6" opacity=".56"/>

  <!-- Lower-middle plum and coral field on the left -->
  <path d="M-250 3485c149-112 386-126 540-17 154 108 212 332 131 497-81 166-302 273-483 220-181-54-318-264-285-451 13-76 37-164 97-249Z" fill="#2D5062" opacity=".075"/>
  <path d="M-137 3594c112-69 274-69 374 13 100 83 126 245 56 351-70 106-225 159-344 111-118-48-200-193-166-316 15-54 34-113 80-159Z" fill="#6D9357" opacity=".1"/>
  <path d="M128 3820c61-51 119-26 170-73 47-43 53-116 122-143" fill="none" stroke="#B8D3A6" stroke-width="7" stroke-linecap="round" opacity=".3"/>

  <!-- Airy sage sweep and balancing dots -->
  <path d="M1410 4305c177-98 411-62 529 91 118 153 93 388-53 508-146 120-377 121-514-4-136-125-167-356-56-501 28-37 57-70 94-94Z" fill="#D6E5D0" opacity=".28"/>
  <ellipse cx="1705" cy="4576" rx="256" ry="210" fill="#F4F7F2" opacity=".5"/>
  <circle cx="1375" cy="4392" r="16" fill="#B8D3A6" opacity=".54"/>
  <circle cx="1334" cy="4366" r="10" fill="#6D9357" opacity=".36"/>

  <!-- Closing landscape: warm orbit at left, supportive sage at right -->
  <circle cx="-5" cy="5305" r="388" fill="#B8D3A6" opacity=".15"/>
  <circle cx="-5" cy="5305" r="255" fill="none" stroke="#2D5062" stroke-width="58" opacity=".05"/>
  <circle cx="-5" cy="5305" r="128" fill="#6D9357" opacity=".08"/>
  <path d="M1445 5425c152-94 369-75 493 54 125 128 130 341 16 469-114 127-324 160-465 65-142-95-202-302-127-455 21-43 46-92 83-133Z" fill="#D6E5D0" opacity=".34"/>
  <path d="M1621 5634c63-50 120-19 173-62 50-40 61-111 126-135" fill="none" stroke="#2D5062" stroke-width="6" stroke-linecap="round" opacity=".12"/>

  <!-- Tiny resting stones close the page -->
  <g opacity=".62">
    <circle cx="775" cy="5790" r="12" fill="#D6E5D0"/>
    <circle cx="817" cy="5790" r="9" fill="#B8D3A6"/>
    <circle cx="854" cy="5790" r="7" fill="#6D9357" opacity=".7"/>
  </g>
  </g>
</svg>
